name: Java CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Stage 1: Build + Test
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Project
        run: mvn clean install -DskipTests && echo "✅ Build successful"

      - name: Run Unit Tests
        run: mvn test && echo "✅ Tests passed"

  # Stage 2: Vulnerability Scan
  dependency_scan:
    runs-on: ubuntu-latest
    needs: build_and_test
    steps:
      - uses: actions/checkout@v4

      - name: Run Dependency Check
        run: mvn org.owasp:dependency-check-maven:check -Dscan=./pom.xml -Dformat=HTML -DoutputDirectory=dependency-check-report

      - name: Upload Vulnerability Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report/dependency-check-report.html

  # Stage 3: Package/Deploy
  package:
    runs-on: ubuntu-latest
    needs: dependency_scan
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t employeeapp:latest . && echo "✅ Docker image built"
