name: Java CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Stage 1: Build + Test
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maven Clean Install (skip tests)
        run: |
          mvn clean install -DskipTests && echo "✅ Build successful" || echo "❌ Build failed"

      - name: Run Unit Tests
        run: |
          mvn test && echo "✅ Tests passed" || echo "❌ Tests failed"

  # Stage 2: Vulnerability Scan
  dependency_scan:
    runs-on: ubuntu-latest
    needs: build_and_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OWASP Dependency Check
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -Dformat=HTML \
            -DoutputDirectory=dependency-check-report \
            && echo "✅ Vulnerability scan completed" || echo "❌ Vulnerabilities found"

      - name: Upload Vulnerability Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report/dependency-check-report.html

  # Stage 3: Package/Deploy
  package:
    runs-on: ubuntu-latest
    needs: dependency_scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t employeeapp:latest . && echo "✅ Docker image built" || echo "❌ Docker build failed"
