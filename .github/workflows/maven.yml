name: Java CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Stage 1: Build + Test
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Project
        run: mvn clean install -DskipTests && echo "✅ Build successful"

#      - name: Run Unit Tests
#        run: mvn test && echo "✅ Tests passed"

  # Stage 2: Package/Deploy
  package:
    runs-on: ubuntu-latest
    needs: build_and_test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
#        run: docker build -t employeeapp:latest . && echo "✅ Docker image built"
# ✅ Build Docker image from Dockerfile
        run : docker build -f Dockerfile -t myapp:latest . && echo "✅ Docker image built"
