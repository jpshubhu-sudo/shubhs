name: Java CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Stage 1: Build + Test
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Maven Clean Install (skip tests)
        run: |
          mvn clean install -DskipTests && echo "✅ Build successful" || echo "❌ Build failed"

      - name: Run Unit Tests
        run: |
          mvn test && echo "✅ Tests passed" || echo "❌ Tests failed"

  # Stage 2: Checkstyle
  checkstyle:
    runs-on: ubuntu-latest
    needs: build_and_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run Checkstyle
        run: |
          mvn checkstyle:check && echo "✅ Checkstyle passed" || echo "❌ Checkstyle issues found"

  # Stage 3: Package/Deploy
  package:
    runs-on: ubuntu-latest
    needs: checkstyle
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: |
          docker build -t employeeapp:latest . && echo "✅ Docker image built" || echo "❌ Docker build failed"
